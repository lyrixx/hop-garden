# yaml-language-server: $schema=../vendor/symfony/routing/Loader/schema/routing.schema.json

# This file is the entry point to configure the routes of your app.
# Methods with the #[Route] attribute are automatically imported.
# See also https://symfony.com/doc/current/routing.html

# To list all registered routes, run the following command:
#   bin/console debug:router

controllers:
    resource: routing.controllers

# The legal pages, public: their texts are in the catalogs of translations/ (legal.*)
legal_notice:
    path: /legal-notice
    methods: GET
    controller: Symfony\Bundle\FrameworkBundle\Controller\TemplateController
    defaults:
        template: legal/notice.html.twig

legal_privacy:
    path: /privacy
    methods: GET
    controller: Symfony\Bundle\FrameworkBundle\Controller\TemplateController
    defaults:
        template: legal/privacy.html.twig

legal_terms:
    path: /terms
    methods: GET
    controller: Symfony\Bundle\FrameworkBundle\Controller\TemplateController
    defaults:
        template: legal/terms.html.twig

# Out of a garden, the assistant of the last one of the member: where a login leads, "Open my garden", the brand and
# the old links (App\Controller\LastGardenController)
assistant:
    path: /assistant
    methods: GET
    controller: App\Controller\LastGardenController
    defaults:
        route: chat

# The paths of before the gardens were in the URLs: the same page in the last garden
legacy_garden:
    path: /garden
    methods: GET
    controller: App\Controller\LastGardenController
    defaults:
        route: garden

legacy_plants:
    path: /plants
    methods: GET
    controller: App\Controller\LastGardenController
    defaults:
        route: plant_index

legacy_spaces:
    path: /spaces
    methods: GET
    controller: App\Controller\LastGardenController
    defaults:
        route: spaces

legacy_notifications:
    path: /notifications
    methods: GET
    controller: App\Controller\LastGardenController
    defaults:
        route: notifications

# The collection of the validated plants merged into the garden
legacy_collection:
    path: /collection
    methods: GET
    controller: App\Controller\LastGardenController
    defaults:
        route: garden
