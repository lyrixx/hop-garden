# yaml-language-server: $schema=../../vendor/symfony/routing/Loader/schema/routing.schema.json
# In the garden of the page: the species search of SpeciesPicker counts in its quota (App\Garden\LatinNameResolver), and
# its members only reach it (App\Garden\GardenOfTheUrl)
live_component:
    resource: '@LiveComponentBundle/config/routes.php'
    prefix: '/g/{garden}/_components'
    requirements:
        # Requirement::ASCII_SLUG, as the routes of the controllers
        garden: '[A-Za-z0-9]+(?:-[A-Za-z0-9]+)*'
