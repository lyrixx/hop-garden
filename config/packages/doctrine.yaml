doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
        # The conversations of the chat agent live in a table of the Symfony AI message store, created by a migration
        schema_filter: '~^(?!chat_conversation$)~'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore_number_aware
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            Account:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Account/Entity'
                prefix: 'App\Account\Entity'
            Garden:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Garden/Entity'
                prefix: 'App\Garden\Entity'
            Plant:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Plant/Entity'
                prefix: 'App\Plant\Entity'
            Reminder:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Reminder/Entity'
                prefix: 'App\Reminder\Entity'
            Settings:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Settings/Entity'
                prefix: 'App\Settings\Entity'

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
