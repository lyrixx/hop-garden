security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        # By email, whatever its case: App\Account\UserRepository::loadUserByIdentifier()
        users:
            entity:
                class: App\Account\Entity\User

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build|bundles)/
            security: false
        # The probe (App\Controller\HealthController): nothing to authenticate, so no firewall at all, not even a
        # stateless one, which would need its own access_control rule
        healthz:
            pattern: ^/healthz$
            security: false
        # The MCP server of the chat agent, called by the worker: the token of each run (App\Mcp\Agent\AgentRunTokens)
        # logs in whoever sent the message, bound to its garden. Before "mcp", whose pattern covers it
        mcp_agent:
            pattern: ^/_mcp/agent
            stateless: true
            provider: users
            user_checker: App\Account\Security\UserChecker
            custom_authenticators:
                - App\Mcp\Agent\Security\AgentRunAuthenticator
            entry_point: App\Mcp\Security\McpEntryPoint
        # The MCP server of the external clients (Claude Desktop, Claude Code, Cursor...): no authenticator until OAuth
        # (phase 3), so a 401 for every request. Its authenticator will log in the user of the access token, bound to the
        # garden they chose (App\Garden\CurrentGarden::TOKEN_ATTRIBUTE), as "app:mcp:stdio --user" does over STDIO
        mcp:
            pattern: ^/_mcp
            stateless: true
            provider: users
            user_checker: App\Account\Security\UserChecker
            entry_point: App\Mcp\Security\McpEntryPoint
        main:
            lazy: true
            provider: users
            # Only an approved member gets in, the others are told why
            user_checker: App\Account\Security\UserChecker
            form_login:
                login_path: login
                check_path: login
                # The assistant of their last garden, or the wizard of a first one
                default_target_path: assistant
                enable_csrf: true
            # 5 failed attempts per address and IP, 25 per IP, in 15 minutes (symfony/rate-limiter)
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            # Signed with the password hash too: a new password ends the remembered sessions
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 2592000 # 30 days
            logout:
                path: /logout
                target: /
                enable_csrf: true

    # Denied by default: only the first matching rule applies. ROLE_USER comes with the approval (App\Account\Entity\User::getRoles())
    access_control:
        # Both MCP servers: a member, from the token of an agent run, or of an external client (OAuth, phase 3)
        - { path: ^/_mcp, roles: ROLE_USER }
        # The public page and the legal pages, by the name of their routes (home, legal_*), whatever their paths
        - { route: ^home$, roles: PUBLIC_ACCESS }
        - { route: ^legal_, roles: PUBLIC_ACCESS }
        # The link of an invitation, and the registration it leads to; joining with an account (invitation_accept) needs one
        - { route: ^invitation(_register)?$, roles: PUBLIC_ACCESS }
        - { path: ^/(login|register|reset-password|locale)(/|$), roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_ADMIN }
        # The gardens (/g/{garden}/...: the chat, the plants, the species, the spaces, the notifications, the live
        # components), the paths of before them (/assistant...), the account, the wizard of a first garden...
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        firewalls:
            # The same firewall, with what stands for the authenticator of phase 3 (OAuth): a token that names the user
            # and the garden, and binds them as the real one will
            mcp:
                pattern: ^/_mcp
                stateless: true
                provider: users
                user_checker: App\Account\Security\UserChecker
                custom_authenticators:
                    - App\Tests\Utils\Mcp\McpClientAuthenticator
                entry_point: App\Mcp\Security\McpEntryPoint
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
