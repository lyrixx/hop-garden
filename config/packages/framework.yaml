# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Note that the session will be started ONLY if you read or write from it.
    session:
        # 12 hours without a request before a session expires (24 minutes in php.ini-production)
        gc_maxlifetime: 43200
        # In the share dir (APP_SHARE_DIR), a volume in production: the conversation of the chat
        # survives a deployment
        save_path: '%kernel.share_dir%/sessions'

    #esi: true
    #fragments: true

    trusted_proxies: '%env(TRUSTED_PROXIES)%'

    # The quotas of a garden, against the cost of the LLM and the spam (App\Garden\GardenQuotas)
    rate_limiter:
        # The runs of its agent: the messages of the chat and the care sheets it drafts
        garden_agent_runs:
            policy: sliding_window
            limit: 200
            interval: '1 day'
            cache_pool: garden_quota.cache
        # The Latin names the species search asks the LLM for (App\Garden\LatinNameResolver)
        garden_latin_names:
            policy: sliding_window
            limit: 100
            interval: '1 day'
            cache_pool: garden_quota.cache
        # The invitations it emails, sent or sent again (App\Garden\Invitations)
        garden_invitations:
            policy: sliding_window
            limit: 20
            interval: '1 day'
            cache_pool: garden_quota.cache

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
