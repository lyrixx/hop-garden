name: Build and push the production image

"on":
    push:
        branches: ["main"]

# One build at a time, the newer push cancelling the older one: "latest" follows the order of the
# pushes, not of the end of the builds
concurrency:
    group: build-push-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    packages: write

env:
    # Fix for symfony/console color detection. We know GitHub Actions can handle it
    ANSICON: "1"
    CASTOR_CONTEXT: prod

jobs:
    build-push:
        name: Build and push the production image
        runs-on: ubuntu-latest
        steps:
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Log in to the registry
              run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            - name: Install Castor
              uses: castor-php/setup-castor@v1.1.0

            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            # Tagged with the short commit sha, what a deployment references, and "latest"
            - name: Build and push the image
              run: castor docker:push --tag="${GITHUB_SHA::7}" --tag=latest
