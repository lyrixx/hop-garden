services:
    router:
        build: services/router
        volumes:
            - "/var/run/docker.sock:/var/run/docker.sock"
            - "./services/router/certs:/etc/ssl/certs"
        ports:
            - "${PROJECT_HTTP_PORT:-80}:80"
            - "${PROJECT_HTTPS_PORT:-443}:443"
            - "${PROJECT_ADMIN_PORT:-8080}:8080"
        networks:
            - default
        profiles:
            - default

    # Catches the emails of the dev environment (MAILER_DSN of .env.dev); its inbox is listed by "castor about"
    mailpit:
        image: axllent/mailpit:v1.33.0
        profiles:
            - default
        labels:
            - "traefik.enable=true"
            - "project-name=${PROJECT_NAME}"
            - "traefik.http.routers.${PROJECT_NAME}-mailpit.rule=Host(`mail.${PROJECT_ROOT_DOMAIN}`)"
            - "traefik.http.routers.${PROJECT_NAME}-mailpit.tls=true"
            - "traefik.http.services.${PROJECT_NAME}-mailpit.loadbalancer.server.port=8025"

    frontend:
        healthcheck:
            test: ['CMD', 'true']

    worker_messenger:
        healthcheck:
            test: ['CMD', 'true']
