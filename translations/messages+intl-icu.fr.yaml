                phone: "numéro de téléphone de l’hébergeur"
        intro: "Les informations que la loi pour la confiance dans l’économie numérique (LCEN) exige d’un site."
        publisher:
            address: "Adresse"
            contact: "Contact"
            heading: "Éditeur"
            name: "Nom"
            registration: "Immatriculation"
            to_complete:
                address: "adresse postale, ou siège social de la société"
                contact: "adresse email et numéro de téléphone"
                name: "prénom et nom, ou raison sociale et forme juridique"
                registration: "numéro SIREN ou RCS, et capital social pour une société"
                vat: "numéro de TVA intracommunautaire, le cas échéant"
            vat: "Numéro de TVA"
        title: "Mentions légales"
    privacy:
        controller:
            heading: "Qui est responsable"
            text: "Le responsable du traitement de vos données est l’éditeur de Hop Garden, désigné dans les {link}mentions légales{link_end}. Pour toute question sur vos données, écrivez à :"
            to_complete: "l’adresse email de contact pour les données personnelles, et le délégué à la protection des données s’il y en a un"
        cookies:
            csrf:
                how_long: "supprimé par la réponse, aussitôt."
                what: "À l’envoi d’un formulaire, comme celui de connexion : il protège l’envoi contre les requêtes falsifiées. La page le pose au moment de l’envoi."
            heading: "Cookies"
            how_long: "Durée :"
            intro: "Hop Garden ne pose que ces cookies, tous strictement nécessaires au service : ils sont dispensés de consentement, et il n’y a pas de bannière cookies. Aucun cookie de mesure d’audience ni de publicité, et aucune ressource chargée depuis un autre site : les polices sont servies par Hop Garden."
            locale:
                how_long: "1 an."
                what: "La langue que vous choisissez, dans la barre du haut, le pied de page ou le bandeau : les pages que vous voyez déconnecté la gardent. Connecté, votre compte la garde aussi."
            mercure:
                how_long: "jusqu’à la fermeture du navigateur, la clé qu’il porte 1 heure, renouvelée par chaque page. La déconnexion le supprime."
                what: "Connecté : il permet à la page de recevoir, au fil de l’eau, les réponses de l’assistant et vos rappels, ceux de votre jardin et de personne d’autre."
            remember_me:
                how_long: "30 jours, ou jusqu’à votre déconnexion. Un nouveau mot de passe y met fin."
                what: "Seulement si vous cochez « Se souvenir de moi pendant 30 jours » à la connexion : il vous reconnecte une fois votre session terminée."
            session:
                how_long: "jusqu’à la fermeture du navigateur. La session elle-même prend fin après 12 heures sans visite."
                what: "Votre session, dès votre première visite : elle vous garde connecté, garde votre conversation avec l’assistant, et protège les formulaires contre les requêtes falsifiées."
        data:
            account: "Votre compte : votre adresse email, votre nom affiché, votre mot de passe (enregistré haché, jamais en clair) et votre langue."
            conversations: "Vos conversations avec l’assistant : vos messages et ses réponses sont enregistrés, et envoyés au fournisseur du modèle de langage qui rédige les réponses. Pour répondre, l’assistant lit votre jardin (fiches, plantes, espaces), et ce qu’il lit part chez le même fournisseur. Le nom d’une espèce que vous cherchez peut aussi lui être envoyé, pour trouver son nom latin ou rédiger sa fiche."
            garden: "Votre jardin : les fiches de culture de vos espèces, vos plantes et leurs espaces, les soins que vous notez, vos notes, vos rappels et vos notifications."
            heading: "Les données que Hop Garden traite"
            invitations: "Les invitations : l’adresse email d’une personne que le propriétaire d’un jardin invite à le rejoindre. Hop Garden lui envoie un email avec le nom affiché de celui qui l’invite, le nom du jardin et un lien valable 14 jours. Ce lien montre à qui l’ouvre le nom du jardin, sa ville, celui qui invite et l’adresse invitée. Quand la personne rejoint le jardin, celui qui l’a invitée reçoit une notification avec son nom affiché, ou le propriétaire s’il n’est plus membre du jardin."
            location: "La position de votre jardin : la ville que vous cherchez, envoyée à Open-Meteo pour la trouver, puis sa latitude et sa longitude, envoyées à Open-Meteo pour la prévision de gel."
            logs:
                text: "Les journaux techniques :"
                to_complete: "ce qu’enregistrent les journaux du serveur et de l’hébergeur, comme l’adresse IP, la date et la page demandée"
            photos: "Les photos que vous ajoutez à vos plantes, stockées sur le serveur de Hop Garden."
            searches: "Les noms des plantes que vous cherchez, envoyés à Trefle pour identifier l’espèce."
            third_parties: "Open-Meteo et Trefle reçoivent ces requêtes du serveur de Hop Garden, jamais de votre navigateur, et rien d’autre sur vous."
        intro: "Cette page explique quelles données personnelles Hop Garden traite, pourquoi, combien de temps, et comment exercer vos droits, conformément au Règlement général sur la protection des données (RGPD)."
        purposes:
            billing: "La facturation, une fois le service payant : une obligation légale (article 6.1.c du RGPD)."
            heading: "Pourquoi, et sur quelle base légale"
            invitation: "L’email d’invitation, envoyé à l’adresse que donne le propriétaire d’un jardin, à sa demande : l’intérêt légitime de ce propriétaire à jardiner avec la personne qu’il invite (article 6.1.f du RGPD)."
            security: "Le bon fonctionnement et la sécurité du service, avec les journaux du serveur : l’intérêt légitime de l’éditeur (article 6.1.f du RGPD)."
            service: "Fournir le service auquel vous vous êtes inscrit (votre compte, votre jardin, les rappels, les alertes gel, l’assistant, les emails sur votre compte) : l’exécution du contrat (article 6.1.b du RGPD)."
        recipients:
            heading: "Qui reçoit vos données"
            members: "Les membres d’un jardin partagé voient et modifient tout ce qu’il contient : fiches, plantes, photos, espaces, soins, notes et rappels. Sur la page des membres, chacun voit le nom affiché des autres, leur rôle et la date à laquelle ils ont rejoint le jardin, pas leur adresse email. Le propriétaire voit aussi les adresses des invitations en attente. La personne invitée, et quiconque a le lien, voit le nom affiché de celui qui l’invite, le nom du jardin et sa ville. Vos conversations avec l’assistant et vos notifications ne sont qu’à vous."
            text: "Au-delà, vos données ne vont qu’aux sous-traitants dont Hop Garden a besoin pour fonctionner, et à Trefle et Open-Meteo comme décrit plus haut."
            to_complete: "la liste des sous-traitants, leur pays, et les garanties pour un transfert hors de l’Union européenne. Par exemple : l’hébergeur de l’application et de sa base de données ; le fournisseur du modèle de langage (Anthropic ou OpenAI, selon la configuration) ; le service d’envoi des emails."
            transfers: "Le fournisseur du modèle de langage peut traiter les conversations hors de l’Union européenne."
        retention:
            account:
                text: "Votre compte, et chaque jardin dont vous êtes le seul membre : tant que votre compte existe. Ils sont supprimés quand vous le supprimez, dans un délai de"
                to_complete: "délai de suppression, sauvegardes comprises"
            conversations:
                text: "Vos conversations avec l’assistant : elles sont supprimées quand vous quittez leur jardin, quand son propriétaire vous en retire, ou avec votre compte. Sinon :"
                to_complete: "durée de conservation"
            heading: "Combien de temps"
            invitations: "Les invitations : elles sont supprimées 30 jours après leur fin, c’est-à-dire leur expiration, leur acceptation ou leur révocation, avec la notification qui annonçait l’arrivée de la personne invitée. Elles partent plus tôt avec leur jardin, ou avec le compte de celui qui les a envoyées."
            invoices:
                text: "Les factures, une fois le service payant :"
                to_complete: "durée de conservation"
            logs:
                text: "Les journaux du serveur :"
                to_complete: "durée de conservation"
            session: "La session : elle prend fin après 12 heures sans visite."
            shared_garden: "Un jardin partagé : il reste à ses autres membres quand vous le quittez, quand son propriétaire vous en retire ou quand vous supprimez votre compte, avec ce que vous y avez ajouté ; vos conversations avec l’assistant dans ce jardin et vos notifications de ce jardin sont supprimées. Il n’est supprimé qu’avec le compte de son dernier membre."
        rights:
            complaint: "Si vous estimez que vos droits ne sont pas respectés, vous pouvez adresser une réclamation à la CNIL ({link})."
            heading: "Vos droits"
            text: "Vous pouvez accéder à vos données, les faire rectifier ou effacer, limiter leur traitement ou vous y opposer, et les recevoir dans un format réutilisable. Écrivez au contact ci-dessus : l’éditeur répond sous un mois."
        title: "Politique de confidentialité"
    terms:
        access:
            availability: "L’éditeur s’efforce de garder Hop Garden disponible, sans garantie : le service peut être interrompu pour maintenance, ou quand un prestataire fait défaut (hébergeur, modèle de langage, Trefle, Open-Meteo)."
            heading: "Accès au service"
            text: "Hop Garden fonctionne dans un navigateur web, avec une connexion internet à votre charge. L’accès passe par une liste d’attente : vous vous inscrivez, confirmez votre adresse email, et votre compte ouvre une fois validé par l’éditeur. Sauf invitation : depuis le lien qu’envoie le propriétaire d’un jardin, un nouveau compte, ou un compte encore sur la liste d’attente qui s’y connecte, entre sans attendre, tout de suite avec l’adresse invitée, et avec une autre une fois celle-ci confirmée. L’éditeur peut limiter le nombre de comptes et l’usage de l’assistant."
        account:
            heading: "Votre compte"
            text: "Vous donnez une adresse email qui est la vôtre et gardez votre mot de passe secret : ce qui est fait avec votre compte relève de votre responsabilité. Vous pouvez supprimer votre compte à tout moment ; vos données sont alors supprimées comme l’explique la {link}politique de confidentialité{link_end}, sauf ce que vous avez ajouté à un jardin partagé, qui reste à ses autres membres."
        changes:
            heading: "Modification des conditions"
            text: "L’éditeur peut modifier ces conditions. Vous êtes prévenu par email avant qu’une nouvelle version s’applique à vous, avec un préavis de"
            to_complete: "durée du préavis"
        content:
            heading: "Vos contenus"
            leaving: "En les ajoutant à un jardin partagé, vous les partagez avec ses membres : ils y restent quand vous quittez le jardin, quand son propriétaire vous en retire ou quand vous supprimez votre compte. Vos conversations avec l’assistant dans ce jardin et vos notifications de ce jardin, elles, sont alors supprimées. Rien dans le jardin n’indique qui a ajouté quoi. Si le propriétaire quitte le jardin ou supprime son compte, le membre le plus ancien en devient propriétaire. Son dernier membre ne peut pas le quitter : le jardin est supprimé avec son compte."
            shared: "Dans un jardin partagé, chaque membre voit et modifie tout ce qu’il contient : fiches, plantes, photos, espaces, soins, notes et rappels. Seul le propriétaire renomme ou déplace le jardin, invite et retire des membres. Vos conversations avec l’assistant et vos notifications ne sont qu’à vous."
            text: "Vos fiches, vos notes et vos photos restent les vôtres. L’éditeur ne les conserve et ne les traite que pour fournir le service."
        data:
            heading: "Données personnelles"
            text: "Hop Garden traite vos données personnelles comme l’explique sa {link}politique de confidentialité{link_end}."
        intro: "Ces conditions régissent l’utilisation de Hop Garden et son abonnement. Créer un compte vaut acceptation."
        law:
            court:
                text: "À défaut de solution amiable, le litige est porté devant"
                to_complete: "le tribunal compétent, dans les limites du droit de la consommation"
            heading: "Droit applicable et litiges"
            law:
                text: "Ces conditions sont soumises au"
                to_complete: "droit applicable, par exemple le droit français"
            mediation:
                text: "En cas de litige, écrivez d’abord à l’éditeur. En tant que consommateur, vous pouvez aussi recourir gratuitement à un médiateur de la consommation :"
                to_complete: "nom, site et adresse du médiateur de la consommation"
        liability:
            heading: "Responsabilité"
            text: "Hop Garden vous aide à prendre soin de votre jardin, il ne remplace pas votre jugement. Les fiches sont rédigées par un modèle de langage à partir des données de Trefle et de ses propres connaissances, et c’est vous qui les validez. Les alertes gel dépendent de la prévision d’Open-Meteo, qui peut se tromper, et de la rusticité inscrite dans chaque fiche."
            to_complete: "les limites de la responsabilité de l’éditeur"
        price:
            heading: "Prix et paiement"
            text: "Hop Garden sera un service payant. Les prix sont affichés toutes taxes comprises avant tout abonnement."
            to_complete: "les prix, les durées d’abonnement, les moyens de paiement, la facturation, le renouvellement et les changements de prix"
        purpose:
            heading: "Objet"
            text: "Hop Garden est une application web qui tient une fiche pour chaque plante de votre jardin, vous rappelle les travaux du mois, vous prévient du gel et propose un assistant de jardinage. Elle est fournie par l’éditeur désigné dans les {link}mentions légales{link_end}."
        termination:
            heading: "Durée et résiliation"
            text: "Vous pouvez mettre fin au service à tout moment en supprimant votre compte. L’éditeur peut suspendre un compte utilisé contre ces conditions ou contre la loi."
            to_complete: "la durée de l’abonnement, le sort de la période payée, et les remboursements"
        title: "Conditions générales de vente"
        withdrawal:
            heading: "Droit de rétractation"
            text: "En tant que consommateur, vous disposez de 14 jours à compter de l’abonnement pour vous rétracter, sans avoir à vous justifier (Code de la consommation, article L221-18). Si vous demandez que le service commence avant la fin de ce délai, vous payez le service fourni jusqu’à votre rétractation (article L221-25)."
            to_complete: "comment se rétracter (formulaire, adresse) et comment vous êtes remboursé"
    to_complete: "À compléter"
