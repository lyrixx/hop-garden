home:
    conversation:
        answer: "Hortensia paniculé"
        message: "Je viens de planter un hortensia sur la terrasse"
        option:
            arborescens: "Hortensia arborescent"
            macrophylla: "Hortensia à grandes feuilles"
            paniculata: "Hortensia paniculé"
        question: "Quel hortensia avez-vous planté ?"
        reply: "Voici sa fiche de culture. Vérifiez les valeurs surlignées, j’en suis moins sûr, puis validez-la."
    figure:
        care_sheet: "Une fiche en brouillon. Chaque valeur a un niveau de confiance : l’assistant surligne celles à vérifier."
        care_sheet_alt: "La fiche en brouillon d’un hortensia paniculé : rusticité, exposition, arrosage, taille et boutures, quatre valeurs surlignées avec une confiance moyenne ou faible, et le bouton Valider."
        conversation: "L’assistant demande lequel, puis rédige la fiche."
        heading: "Dans l’application"
        reminders: "Les rappels à venir, et la prévision de gel avec les plantes menacées."
        reminders_alt: "Deux cartes. À venir : une alerte gel pour le citronnier, et la taille du rosier grimpant le 1er février. Prévisions de gel : trois nuits de -3,2 °C à -12,4 °C, le citronnier menacé chaque nuit."
    hero:
        heading: "Savoir quand tailler. Être prévenu avant le gel."
        kicker: "Votre carnet de jardin"
        lede: "Hop Garden tient une fiche pour chaque plante de votre jardin. Il vous dit quoi faire chaque mois, et vous prévient quand une nuit sera trop froide pour l’une d’elles. Dites-le en une phrase : il propose, vous validez."
        more: "Voir ce qu’il règle"
    join:
        heading: "Hop Garden ouvre à quelques jardiniers à la fois."
        text: "Inscrivez-vous dès maintenant : les comptes ouvrent par petits groupes, et nous vous écrivons quand le vôtre est prêt."
    problem:
        care_sheet:
            heading: "Les fiches trouvées en ligne se contredisent."
            text: "L’assistant rédige la fiche de culture à partir des données botaniques de Trefle et de ses propres connaissances. Chaque valeur a un niveau de confiance, les incertaines sont surlignées, et la fiche cite ses sources. Vous vérifiez, vous corrigez ce que vous savez mieux, et la fiche reste un brouillon tant que vous ne l’avez pas validée."
        frost:
            heading: "Un gel tardif tue une plante."
            text: "Activez l’alerte gel d’une plante : chaque matin à 7 h, Hop Garden lit la prévision Open-Meteo des trois prochains jours et la compare à sa rusticité, plus 2 °C de marge. Si une nuit s’annonce trop froide pour votre citronnier, une notification dans Hop Garden vous prévient le matin même, à temps pour le rentrer."
        mcp:
            heading: "Votre assistant IA ne connaît pas votre jardin."
            text: "Hop Garden est aussi un serveur MCP. Branchez Claude Desktop, Claude Code, Cursor ou un autre client MCP : il cherche des plantes, lit vos fiches et vos espaces, consulte la prévision de gel. Pour ajouter une plante, il vous donne le lien de sa carte, et c’est vous qui confirmez."
        notebook:
            heading: "Tenir un carnet de jardin prend trop de temps."
            text: "Écrivez « Je viens de planter un hortensia sur la terrasse ». L’assistant demande quel hortensia, puis propose chaque étape sur une carte : la fiche, l’espace s’il est nouveau, la plante. Rien n’entre dans votre jardin avant que vous touchiez sa carte. Vous préférez les formulaires ? Tout se fait aussi à la main."
        pruning:
            heading: "On oublie quand tailler."
            text: "Chaque fiche donne les mois où tailler, couper les fleurs fanées et bouturer. Activez un rappel : le 1er de chacun de ces mois, une notification dans Hop Garden vous dit quelle plante attend."
        soon:
            heading: "À plusieurs, on ne sait pas qui a fait quoi."
            label: "Bientôt"
            text: "Les jardins partagés arrivent, avec des invitations pour y faire entrer ceux avec qui vous jardinez."
        spaces:
            heading: "On ne sait plus ce qu’on a planté, ni où."
            text: "Décrivez les espaces de votre jardin, comme la terrasse ou le massif nord, avec leur exposition et leur sol. Chaque plante a son espace, sa photo, les soins reçus et ses voisines. Hop Garden vous signale une plante de plein soleil installée à l’ombre."
    problems:
        heading: "Ce que Hop Garden règle"
    title: "Hop Garden · Rappels de taille et alertes gel pour votre jardin"
