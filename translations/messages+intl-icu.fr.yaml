            to_complete: "la liste des sous-traitants, leur pays, et les garanties pour un transfert hors de l’Union européenne. Par exemple : l’hébergeur de l’application et de sa base de données ; le fournisseur du modèle de langage (Anthropic ou OpenAI, selon la configuration) ; le service d’envoi des emails, quand Hop Garden en enverra."
            transfers: "Le fournisseur du modèle de langage peut traiter les conversations hors de l’Union européenne."
