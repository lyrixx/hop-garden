home:
    conversation:
        answer: "Panicled hydrangea"
        message: "I just planted a hydrangea on the terrace"
        option:
            arborescens: "Smooth hydrangea"
            macrophylla: "Bigleaf hydrangea"
            paniculata: "Panicled hydrangea"
        question: "Which hydrangea did you plant?"
        reply: "Here is its care sheet. Check the highlighted values, I am less sure of them, then validate it."
    figure:
        care_sheet: "A draft care sheet. Each value has a confidence level: the assistant highlights the ones to check."
        care_sheet_alt: "The draft care sheet of a panicled hydrangea: hardiness, exposure, watering, pruning and cuttings, four values highlighted with a medium or low confidence, and the Validate button."
        conversation: "The assistant asks which one, then drafts the care sheet."
        heading: "In the application"
        reminders: "The reminders coming up, and the frost forecast with the plants it threatens."
        reminders_alt: "Two cards. Coming up: a frost alert for the lemon tree, and the pruning of the climbing rose on 1 February. Frost forecast: three nights from -3.2 °C to -12.4 °C, each with the lemon tree at risk."
    hero:
        heading: "Know when to prune. Get warned before the frost."
        kicker: "Your garden notebook"
        lede: "Hop Garden keeps a care sheet for each plant in your garden. It tells you what to do each month, and warns you when a night will be too cold for one of them. Say it in one sentence: it proposes, you validate."
        more: "See what it takes care of"
    join:
        heading: "Hop Garden opens to a few gardeners at a time."
        text: "Sign up now: accounts open in small groups, and we email you when yours is ready."
    problem:
        care_sheet:
            heading: "Care sheets found online contradict each other."
            text: "The assistant drafts the care sheet from the botanical data of Trefle and its own knowledge. Each value has a confidence level, the uncertain ones are highlighted, and the sheet names its sources. You check, you correct what you know better, and the sheet stays a draft until you validate it."
        frost:
            heading: "A late frost kills a plant."
            text: "Turn on the frost alert of a plant: every morning at 7, Hop Garden reads the Open-Meteo forecast for the next three days and compares it with the hardiness of the plant, plus 2 °C of margin. If a night will be too cold for your lemon tree, a notification in Hop Garden warns you that same morning, in time to bring it in."
        mcp:
            heading: "Your AI assistant does not know your garden."
            text: "Hop Garden is also an MCP server. Connect Claude Desktop, Claude Code, Cursor or another MCP client: it searches plants, reads your care sheets and your spaces, checks the frost forecast. To add a plant, it gives you the link to its card, and you confirm."
        notebook:
            heading: "Keeping a garden notebook takes too long."
            text: "Write “I just planted a hydrangea on the terrace”. The assistant asks which hydrangea, then proposes each step on a card: the care sheet, the space if it is new, the plant. Nothing joins your garden until you tap its card. Rather use forms? Everything can be done by hand too."
        pruning:
            heading: "You forget when to prune."
            text: "Each care sheet gives the months to prune, deadhead and take cuttings. Turn on a reminder: on the 1st of each of these months, a notification in Hop Garden tells you which plant is due."
        shared:
            heading: "You garden together, yet everyone keeps their own notes."
            text: "Invite the people you garden with by email: they join your garden without going through the waiting list. Every member sees and edits the same care sheets, plants, spaces and reminders, and each of them gets the reminders and the frost alerts. Anyone can leave the garden; if its owner leaves, the oldest member takes over."
        spaces:
            heading: "You no longer know what you planted, or where."
            text: "Describe the spaces of your garden, such as the terrace or the north bed, with their exposure and their soil. Each plant has its space, its photo, the care it got and its neighbours. Hop Garden tells you when a plant that likes full sun grows in the shade."
    problems:
        heading: "What Hop Garden takes care of"
    title: "Hop Garden · Pruning reminders and frost alerts for your garden"
