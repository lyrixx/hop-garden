            to_complete: "the contact email address for personal data, and the data protection officer if there is one"
        cookies:
            csrf:
                how_long: "deleted by the answer, right away."
                what: "When you send a form, such as the login: it protects the sending against forged requests. The page sets it as you send."
            heading: "Cookies"
            how_long: "How long:"
            intro: "Hop Garden sets these cookies only, all strictly necessary to the service: they need no consent, and there is no cookie banner. No cookie for audience measurement or advertising, and no resource loaded from another site: the fonts are served by Hop Garden."
            locale:
                how_long: "1 year."
                what: "The language you choose, in the top bar, the footer or the banner: the pages you see logged out keep it. Logged in, your account keeps it too."
            mercure:
                how_long: "until you close your browser, the key it holds 1 hour, renewed by each page. Logging out deletes it."
                what: "Logged in: it lets the page receive, as they come, the answers of the assistant and your reminders, those of your garden and no one else's."
            remember_me:
                how_long: "30 days, or until you log out. A new password ends it."
                what: "Only if you tick “Remember me for 30 days” when you log in: it logs you in again once your session has ended."
            session:
                how_long: "until you close your browser. The session itself ends after 12 hours without a visit."
                what: "Your session, from your first visit: it keeps you logged in and your conversation with the assistant, and protects the forms against forged requests."
        data:
            account: "Your account: your email address, your display name, your password (stored hashed, never in clear) and your language."
            conversations: "Your conversations with the assistant: your messages and its answers are stored, and sent to the provider of the language model that writes the answers. To answer, the assistant reads your garden (care sheets, plants, spaces), and what it reads goes to the same provider. The name of a species you look up may be sent to it too, to find its Latin name or draft its care sheet."
            garden: "Your garden: the care sheets of your species, your plants and their spaces, the care you record, your notes, your reminders and your notifications."
            heading: "The data Hop Garden processes"
            invitations: "Invitations: the email address of a person the owner of a garden invites to join it. Hop Garden sends them an email with the display name of the one who invites, the name of the garden and a link valid for 14 days. That link shows whoever opens it the name of the garden, its city, the one who invites and the address invited. When the person joins the garden, the one who invited them gets a notification with their display name, or the owner if the one who invited is no longer a member of the garden."
            location: "The location of your garden: the city you search, sent to Open-Meteo to find it, then its latitude and longitude, sent to Open-Meteo for the frost forecast."
            logs:
                text: "Technical logs:"
                to_complete: "what the logs of the server and of the host record, such as the IP address, the date and the page requested"
            photos: "The photos you add to your plants, stored on the server of Hop Garden."
            searches: "The names of the plants you search, sent to Trefle to identify the species."
            third_parties: "Open-Meteo and Trefle receive these requests from the server of Hop Garden, never from your browser, and nothing else about you."
        intro: "This page explains which personal data Hop Garden processes, why, for how long, and how to exercise your rights, under the General Data Protection Regulation (GDPR)."
        purposes:
            billing: "Invoicing, once the service is paid: a legal obligation (article 6(1)(c) GDPR)."
            heading: "Why, and on what legal basis"
            invitation: "The invitation email, sent to the address the owner of a garden gives, at their request: the legitimate interest of that owner in gardening with the person they invite (article 6(1)(f) GDPR)."
            security: "Keeping the service running and secure, with the logs of the server: the legitimate interest of the publisher (article 6(1)(f) GDPR)."
            service: "Providing the service you signed up for (your account, your garden, the reminders, the frost alerts, the assistant, the emails about your account): the performance of the contract (article 6(1)(b) GDPR)."
        recipients:
            heading: "Who receives your data"
            members: "The members of a shared garden see and edit everything in it: care sheets, plants, photos, spaces, care, notes and reminders. On the page of the members, each of them sees the display name of the others, their role and the date they joined the garden, not their email address. The owner also sees the addresses of the invitations waiting. The person invited, and anyone with the link, sees the display name of the one who invites, the name of the garden and its city. Your conversations with the assistant and your notifications are yours alone."
            text: "Beyond them, your data only goes to the processors Hop Garden needs to run, and to Trefle and Open-Meteo as described above."
            to_complete: "the list of the processors, their country, and the safeguards for a transfer outside the European Union. For example: the host of the application and its database; the provider of the language model (Anthropic or OpenAI, depending on the configuration); the email service."
            transfers: "The provider of the language model may process the conversations outside the European Union."
        retention:
            account:
                text: "Your account, and each garden you are the only member of: as long as your account exists. They are deleted when you delete it, within"
                to_complete: "the delay of deletion, backups included"
            conversations:
                text: "Your conversations with the assistant:"
                to_complete: "how long they are kept"
            heading: "For how long"
            invitations: "Invitations: they stay recorded once expired, accepted or revoked, even when the person invited deletes their account. They are only deleted with their garden, or with the account of the one who sent them."
            invoices:
                text: "Invoices, once the service is paid:"
                to_complete: "how long they are kept"
            logs:
                text: "The logs of the server:"
                to_complete: "how long they are kept"
            session: "The session: it ends after 12 hours without a visit."
            shared_garden: "A shared garden: it stays with its other members when you leave it or delete your account, with what you added to it. It is only deleted with the account of its last member."
        rights:
            complaint: "If you think your rights are not respected, you can lodge a complaint with a data protection authority, such as the CNIL in France ({link})."
            heading: "Your rights"
            text: "You can access your data, have it corrected or erased, restrict or object to its processing, and receive it in a reusable format. Write to the contact above: the publisher answers within one month."
        title: "Privacy policy"
    terms:
        access:
            availability: "The publisher strives to keep Hop Garden available, without guarantee: it may be interrupted for maintenance, or when a provider fails (host, language model, Trefle, Open-Meteo)."
            heading: "Access to the service"
            text: "Hop Garden works in a web browser, with an internet connection at your expense. Access opens through a waiting list: you sign up, confirm your email address, and your account opens once the publisher has validated it. Except with an invitation: an account created from the link the owner of a garden sends gets in without the waiting list, at once with the address invited, and with another one once that address is confirmed. The publisher may limit the number of accounts and the use of the assistant."
        account:
            heading: "Your account"
            text: "You give an email address that is yours and keep your password secret: what is done with your account is your responsibility. You can delete your account at any time; your data is then deleted as the {link}privacy policy{link_end} explains, except what you added to a shared garden, which stays with its other members."
        changes:
            heading: "Changes to these terms"
            text: "The publisher may change these terms. You are told by email before a new version applies to you, with a notice of"
            to_complete: "the notice period"
        content:
            heading: "Your content"
            leaving: "By adding them to a shared garden, you share them with its members: they stay there when you leave the garden, when its owner removes you from it or when you delete your account. Nothing in the garden tells who added what. If the owner leaves the garden or deletes their account, the oldest member becomes its owner. Its last member cannot leave it: the garden is deleted with their account."
            shared: "In a shared garden, every member sees and edits everything in it: care sheets, plants, photos, spaces, care, notes and reminders. Only the owner renames or moves the garden, invites and removes members. Your conversations with the assistant and your notifications remain yours."
            text: "Your care sheets, notes and photos remain yours. The publisher only stores and processes them to provide the service."
        data:
            heading: "Personal data"
            text: "Hop Garden processes your personal data as its {link}privacy policy{link_end} explains."
        intro: "These terms govern the use of Hop Garden and its subscription. Creating an account means accepting them."
        law:
            court:
                text: "Failing an amicable solution, the dispute goes to"
                to_complete: "the competent court, within the limits of consumer law"
            heading: "Applicable law and disputes"
            law:
                text: "These terms are governed by"
                to_complete: "the applicable law, for example French law"
            mediation:
                text: "In case of dispute, write to the publisher first. As a consumer, you can also turn to a consumer mediator, free of charge:"
                to_complete: "name, website and address of the consumer mediator"
        liability:
            heading: "Liability"
            text: "Hop Garden helps you look after your garden, it does not replace your judgement. The care sheets are drafted by a language model from the data of Trefle and its own knowledge, and you validate them. The frost alerts depend on the Open-Meteo forecast, which can be wrong, and on the hardiness written in each care sheet."
            to_complete: "the limits of the liability of the publisher"
        price:
            heading: "Price and payment"
            text: "Hop Garden will be a paid service. Prices are shown, taxes included, before any subscription."
            to_complete: "the prices, the subscription periods, the payment methods, the invoicing, the renewal and the changes of price"
        purpose:
            heading: "Purpose"
            text: "Hop Garden is a web application that keeps a care sheet for each plant of your garden, reminds you of the work of the month, warns you of frost and offers a gardening assistant. It is provided by the publisher named in the {link}legal notice{link_end}."
        termination:
            heading: "Duration and termination"
            text: "You can end the service at any time by deleting your account. The publisher may suspend an account used against these terms or the law."
            to_complete: "the duration of the subscription, what happens to the paid period, and the refunds"
        title: "Terms of sale"
        withdrawal:
            heading: "Right of withdrawal"
            text: "As a consumer, you have 14 days from the subscription to withdraw, without giving a reason (French Consumer Code, article L221-18). If you ask for the service to start before the end of this period, you pay for the service provided until you withdraw (article L221-25)."
            to_complete: "how to withdraw (form, address) and how you are refunded"
